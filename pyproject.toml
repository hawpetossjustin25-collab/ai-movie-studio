[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-movie-studio"
version = "1.0.0"
description = "100% Free Forever CPU-First AI Movie Maker — Generates 30-Minute Episodes & Automatically Stitches Full 3-Hour Movies"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "hawpetossjustin25-collab"}]
dependencies = [
    "imageio-ffmpeg>=0.5.1",
    "Pillow>=10.0.0",
    "edge-tts>=6.1.0",
    "pyttsx3>=2.90",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "PyQt6>=6.0.0",
]

[project.scripts]
ai-movie-studio = "movie_studio_app:main"

[tool.setuptools]
py-modules = ["movie_planner", "movie_engine", "movie_studio_app", "test_movie_studio"]
